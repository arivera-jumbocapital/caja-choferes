<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Caja de Choferes Tasty Choice</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root { --brand-red: #c8141b; --brand-blue: #0a4d8f; --brand-gold: #f2b230; --paper: #f2f4f7; --card: #ffffff; --ink: #16202b; --muted: #5a6572; --line: #d5dce4;
  --accent: #0a4d8f; --accent-ink: #ffffff; --bad: #b42318; --bad-soft: #fbe7e5;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif; --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --brand-red: #ff5a5f; --paper: #0e1318; --card: #161d25; --ink: #e5eaf0; --muted: #97a2ae; --line: #2b3641; --accent: #7fb2ec; --accent-ink: #0e1318; --bad: #ff8576; --bad-soft: #3a1714; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; display: grid; place-items: center; min-height: 100vh; padding: 16px; }
.card { width: min(100%, 380px); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px 20px; display: grid; gap: 14px; }
.logo { display: grid; justify-items: center; gap: 8px; }
.logo img { height: 92px; width: auto; background: #fff; border-radius: 6px; }
.eyebrow { font-family: var(--f-display); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-red); font-weight: 700; }
h1 { font-family: var(--f-display); margin: 0; font-size: 1.5rem; text-align: center; }
.stripe { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--brand-red) 0 34%, var(--brand-gold) 34% 50%, var(--brand-blue) 50% 100%); }
label { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
input { font: inherit; font-size: 1.05rem; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; width: 100%; text-transform: none; letter-spacing: normal; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; font-size: 1.05rem; border-radius: 10px; padding: 13px 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 10px 12px; font-size: .92rem; }
.hint { color: var(--muted); font-size: .86rem; text-align: center; margin: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="logo"><img src="/logo.png" alt="Tasty Choice"><div class="eyebrow">Desglose de dinero</div></div>
  <h1>Caja de Choferes</h1>
  <div class="stripe" aria-hidden="true"></div>
  <label>Usuario<input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
  <label>Clave<input id="c" name="password" type="password" autocomplete="current-password" required></label>
  <div class="err" id="err" role="alert" hidden></div>
  <button id="b" type="submit">Entrar</button>
  <p class="hint">¿Olvidaste tu clave? Pídele al gerente que te asigne una nueva.</p>
</form>
<script>
(function () {
  "use strict";
  var f = document.getElementById("f"), err = document.getElementById("err"), b = document.getElementById("b");
  function show(m) { err.textContent = m; err.hidden = !m; }
  f.addEventListener("submit", function (e) {
    e.preventDefault(); show(""); b.disabled = true; b.textContent = "Entrando…";
    fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
      body: JSON.stringify({ usuario: document.getElementById("u").value, clave: document.getElementById("c").value }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (!x.ok) throw new Error(x.j.error || "No se pudo entrar.");
        var next = new URLSearchParams(location.search).get("next") || "";
        location.replace(/^\/(portal|chofer|cuenta)(\b|$)/.test(next) ? next : x.j.destino);
      })
      .catch(function (e2) { show(e2.message === "Failed to fetch" ? "Sin conexión. Revisa el internet e intenta de nuevo." : e2.message); b.disabled = false; b.textContent = "Entrar"; });
  });
  document.getElementById("u").focus();
})();
</script>
</body>
</html>
