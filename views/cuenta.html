<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi clave · Caja de Choferes</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root { --brand-red: #c8141b; --brand-blue: #0a4d8f; --brand-gold: #f2b230; --paper: #f2f4f7; --card: #ffffff; --ink: #16202b; --muted: #5a6572; --line: #d5dce4;
  --accent: #0a4d8f; --accent-ink: #ffffff; --bad: #b42318; --bad-soft: #fbe7e5; --good: #17703f; --good-soft: #e2f3e9;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif; --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --brand-red: #ff5a5f; --paper: #0e1318; --card: #161d25; --ink: #e5eaf0; --muted: #97a2ae; --line: #2b3641; --accent: #7fb2ec; --accent-ink: #0e1318; --bad: #ff8576; --bad-soft: #3a1714; --good: #57c98a; --good-soft: #13301f; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; display: grid; place-items: center; min-height: 100vh; padding: 16px; }
.card { width: min(100%, 400px); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: grid; gap: 14px; }
header { display: flex; align-items: center; gap: 12px; }
header img { height: 54px; background: #fff; border-radius: 6px; }
h1 { font-family: var(--f-display); margin: 0; font-size: 1.4rem; }
.who { color: var(--muted); font-size: .9rem; }
.stripe { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--brand-red) 0 34%, var(--brand-gold) 34% 50%, var(--brand-blue) 50% 100%); }
label { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; width: 100%; }
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; border-radius: 10px; padding: 12px 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
a { color: var(--accent); font-weight: 600; }
.msg { border-radius: 8px; padding: 10px 12px; font-size: .92rem; }
.msg.err { color: var(--bad); background: var(--bad-soft); } .msg.ok { color: var(--good); background: var(--good-soft); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<form class="card" id="f">
  <header><img src="/logo.png" alt="Tasty Choice"><div><h1>Cambiar mi clave</h1><div class="who" id="who"></div></div></header>
  <div class="stripe" aria-hidden="true"></div>
  <input type="text" name="username" id="un" autocomplete="username" hidden>
  <label>Clave actual<input type="password" id="a" autocomplete="current-password" required></label>
  <label>Clave nueva (mínimo 6 caracteres)<input type="password" id="n" autocomplete="new-password" minlength="6" required></label>
  <label>Repite la clave nueva<input type="password" id="n2" autocomplete="new-password" minlength="6" required></label>
  <div class="msg" id="msg" role="status" hidden></div>
  <button type="submit">Guardar clave nueva</button>
  <a href="/" id="back">← Volver</a>
</form>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function msg(t, cls) { $("msg").textContent = t; $("msg").className = "msg " + cls; $("msg").hidden = !t; }
  fetch("/api/yo", { credentials: "same-origin" }).then(function (r) { if (r.status === 401) location.replace("/login?next=/cuenta"); return r.json(); })
    .then(function (u) { $("who").textContent = (u.nombre || u.usuario) + " · usuario " + u.usuario; $("un").value = u.usuario; });
  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    if ($("n").value !== $("n2").value) return msg("Las dos claves nuevas no son iguales.", "err");
    fetch("/api/mi-clave", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ actual: $("a").value, nueva: $("n").value }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || "No se pudo cambiar."); }); })
      .then(function () { msg("Clave cambiada. Úsala la próxima vez que entres.", "ok"); $("f").reset(); }, function (er) { msg(er.message, "err"); });
  });
})();
</script>
</body>
</html>
